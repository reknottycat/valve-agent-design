# -----------------------------------------------------------------------------
# 未决问题登记（INV-11 要求：疑似同族量不得沉默并存）
# -----------------------------------------------------------------------------
# 本段登记**本轮没有合并**的疑似同族物理量。理由是它们只是"看起来像"，
# 尚未确认是否同一物理量 —— 合并是事实判断，不能靠命名相似度推定。
# 校验器会把本段里的每一组都检查一遍：若将来它们真的同名同量，
# INV-11 会继续报错，逼着做决定，而不是让它们悄悄并存。
# -----------------------------------------------------------------------------
open_questions:
  - id: OQ-01
    title: 许用应力族：三个 qid 是否同一物理量
    quantities:
      - Q:MAT:MAX_WORKING_STRESS      # 最大工作应力（F-MAT-001 的 σ_max）
      - Q:MAT:ALLOWABLE_STRESS        # 许用应力（F-MAT-001 的 σ_allow）
      - Q:STRUCT:ALLOWABLE_STRESS     # 最大许用工作应力（F-STR-004/005 的 S）
    question: >-
      F-MAT-001 是**无标准来源绑定的通用力学式**（利用率校核），
      它的 σ_allow 指"该零件的许用应力"；
      F-STR-004/005 的 S 指 BPVC 语境下的"最大许用工作应力"（随材料与温度而变）。
      两者概念高度重叠但作用域不同：一个是零件级，一个是受压件级。
    not_merged_because: >-
      作用域差异未确认。BPVC 的 S 与零件许用应力在数值上是否总等，
      取决于材料分组与温度，本库尚无足够的已核验条目支撑这个判断。
      合并需要材料侧的证据，超出本轮本体层的范围。
    resolution_hint: >-
      待材料性能类条目（许用应力表）进入参数层后，用"同一材料同一温度下 S 的取值"
      交叉验证，再决定是否合并。

  - id: OQ-02
    title: 最小壁厚族：公式算出的最小壁厚 vs 标准给的限值
    quantities:
      - Q:STRUCT:MIN_WALL_THICKNESS    # 壳板最小厚度（F-STR-004/005 的 t，公式算得）
      - Q:MAT:MIN_WALL_THICKNESS       # 最小壁厚（P-MAT 的 0.200 in / 5.0 mm，标准限值）
    question: >-
      一个是 F-STR-004/005 由应力与许用应力**算出来**的最小壁厚，
      一个是 PW-39 通用注 (11) 给的**最小壁厚限值**。
      二者是不是同一个物理量，取决于标准是否把公式结果直接当限值用。
    not_merged_because: >-
      本库还没有把公式算得值与标准限值逐条比对的证据。
      合并会把"计算目标"与"规范限值"混为一谈。
    resolution_hint: >-
      待能用同一工况同时算出 t 与读出限值时再判定；
      在此之前，两者应是两个不同 qid（一个说明怎么算，一个说明不能低于多少）。
