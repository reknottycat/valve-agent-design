# =============================================================================
# standards_kb / 本体词表：Quantity（物理量）+ Context（适用上下文）
# -----------------------------------------------------------------------------
# 这是全库的**中枢**。所有公式变量、参数取值、表列值，最终都指向这里的某个
# qid。qid 跨标准唯一 —— 同一物理量在 BPVC-I 和 B31.1 的两个取值，
# 是同一个 qid 的两个 occurrence，不是两个 qid。
#
# 命名：Q:<域>:<SLUG>   X:<类>:<SLUG>
# 域用既有的 domain 词表（两层共享，12 值），不新增只出现在本层的值。
# =============================================================================

meta:
  schema: standards_kb.ontology.vocabulary/1.0
  version: "1.0.0+20261022"
  created: "2026-10-22"
  derived_from: "93 条已核验条目（公式 23 / 参数 57 / 数据 13）反推 + 人工归并"

# =============================================================================
# Context —— 适用上下文
# =============================================================================
contexts:

  # --- 单位制 ---
  - xid: X:UNIT_SYSTEM:US
    kind: UNIT_SYSTEM
    name_zh: 英制单位（U.S. Customary Units）
    name_en: U.S. Customary Units

  - xid: X:UNIT_SYSTEM:SI
    kind: UNIT_SYSTEM
    name_zh: 公制单位（SI Units）
    name_en: SI Units

  - xid: X:UNIT_SYSTEM:MIXED
    kind: UNIT_SYSTEM
    name_zh: 原文同时给出英制与公制
    name_en: Both units stated in source

  # --- 材料组 ---
  - xid: X:MATERIAL_GROUP:P_NO_1_GR_1_2_3
    kind: MATERIAL_GROUP
    name_zh: ASME P-No.1 组，Group No. 1/2/3（碳钢、低合金钢）
    name_en: P-No.1 Group Nos. 1, 2, 3

  - xid: X:MATERIAL_GROUP:P_NO_1_GR_2
    kind: MATERIAL_GROUP
    name_zh: ASME P-No.1 组，Group No.2（更高碳钢）
    name_en: P-No.1 Group No. 2

  # --- 介质 ---
  - xid: X:MEDIUM:WATER
    kind: MEDIUM
    name_zh: 水
    name_en: water

  - xid: X:MEDIUM:DRY_SATURATED_STEAM
    kind: MEDIUM
    name_zh: 干饱和蒸汽
    name_en: dry saturated steam

  # --- 阀座/接口型式 ---
  - xid: X:SEAT_TYPE:CONICAL_45
    kind: SEAT_TYPE
    name_zh: 45° 锥座
    name_en: 45 deg seat

  - xid: X:SEAT_TYPE:FLAT
    kind: SEAT_TYPE
    name_zh: 平座
    name_en: flat seat

  - xid: X:NOZZLE_TYPE:SPRAY_NOZZLE
    kind: NOZZLE_TYPE
    name_zh: 喷嘴型接口
    name_en: spray nozzle

  # --- PWHT 判据分支路径（同名条款在不同标准下路径不同） ---
  - xid: X:PWHT_PATH:BPVC_NOTE_A1
    kind: PWHT_PATH
    name_zh: BPVC-I TABLE PW-39 通用注 (a)(1) 路径（预热 200 °F，不看 CE）
    note: 该路径的判据是预热温度，与碳当量无关

  - xid: X:PWHT_PATH:BPVC_NOTE_A2
    kind: PWHT_PATH
    name_zh: BPVC-I TABLE PW-39 通用注 (a)(2) 路径（CE ≤ 0.45 + 预热 250 °F）
    note: 焊缝厚 19~38 mm 区间

  - xid: X:PWHT_PATH:B31_1_NOTE_A
    kind: PWHT_PATH
    name_zh: ASME B31.1 Table 132 通用注 (a) 路径（预热 200 °F）
    note: 与 BPVC 的 (a)(1) 平行但不是同一标准，数值不可直接互换

  - xid: X:PWHT_PATH:B31_1_NOTE_B
    kind: PWHT_PATH
    name_zh: ASME B31.1 Table 132 通用注 (b) 路径（CE < 0.50 + 预热 250 °F）
    note: 与 BPVC 的 (a)(2) 平行但阈值不同，见易混对集合

  # --- 标准 ---
  - xid: X:STANDARD:ASME_BPVC_I
    kind: STANDARD
    name_zh: ASME BPVC Section I-2010

  - xid: X:STANDARD:ASME_B31_1
    kind: STANDARD
    name_zh: ASME B31.1-2007

  # --- 其他上下文 ---
  - xid: X:TEST_TYPE:CAPACITY_DISCHARGE_COEFF
    kind: TEST_TYPE
    name_zh: 排放系数容量试验
    name_en: coefficient of discharge capacity test

  - xid: X:REGION:SUPERCRITICAL
    kind: REGION
    name_zh: 超临界压力区
    note: BPVC-I PG-69.2.3 修正因子适用区 / PG-69.3 外推区

# =============================================================================
# Quantity —— 物理量
# =============================================================================
# domain 取既有共享词表值；dimension 是量纲（与 domain 不同概念）。
# canonical_unit 是**该物理量本体的单位**，单位制差异由 occurrence 承担。
# =============================================================================
quantities:

  # ===================== TEST 域 =====================
  - qid: Q:TEST:WATER_FLOW_CONSTANT
    name_zh: 水试验理论流量常数
    name_en: theoretical capacity constant for tests with water
    domain: TEST
    dimension: MASS_FLOW
    canonical_unit: "kg/hr per (mm^2 * sqrt(MPa * kg/m^3))"
    symbol_candidates: []
    notes: >-
      理论流量式 W_T = C × πDL × (0.707) × √((P−P_d)w) 中的系数 C。
      英制 2407 (lb/hr…) 与公制 5.092 (kg/hr…) 是同一物理量的两个 occurrence。

  - qid: Q:TEST:STEAM_FLOW_CONSTANT
    name_zh: 干饱和蒸汽理论流量常数
    name_en: theoretical capacity constant for tests with dry saturated steam
    domain: TEST
    dimension: MASS_FLOW
    canonical_unit: "kg/hr per (mm^2 * MPa)"
    symbol_candidates: []
    notes: >-
      蒸汽式 W_T = C × πDLP（压力项线性，**无根号**），与水的式子形式不同。
      英制 51.5 / 公制 5.25。

  - qid: Q:TEST:SEAT_AREA_FACTOR
    name_zh: 阀座面积因子
    name_en: seat area factor
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []

  - qid: Q:TEST:DISCHARGE_COEFF
    name_zh: 排放系数 K
    name_en: coefficient of discharge
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: ["K", "K_D"]

  - qid: Q:TEST:DISCHARGE_COEFF_MEAN_FACTOR
    name_zh: 单阀排放系数相对平均值的折减系数
    name_en: single-valve discharge coefficient mean factor
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []
    notes: K 上限 0.878 = 0.90 × 0.975 中的 0.90 那一项

  - qid: Q:TEST:DISCHARGE_COEFF_CAP_FACTOR
    name_zh: 排放系数上限的构成因子
    name_en: discharge coefficient cap factor
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []
    notes: K 上限 0.878 = 0.90 × 0.975 中的 0.975 那一项

  - qid: Q:TEST:BETA_RATIO
    name_zh: 排放系数适用区间（beta ratio）
    name_en: beta ratio
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []

  - qid: Q:TEST:FLOW_UNIT_FACTOR
    name_zh: 流量单位换算因子
    name_en: flow unit conversion factor
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []
    notes: 水流量 lb/hr → gal/min（1/500）、kg/hr → L/min（1/60）

  - qid: Q:TEST:PRESSURE_CORRECTION_LIMIT
    name_zh: 压力修正因子适用压力界限
    name_en: pressure bound for correction factor
    domain: TEST
    dimension: PRESSURE
    canonical_unit: MPa
    symbol_candidates: []

  - qid: Q:TEST:SUPERCRITICAL_CONST
    name_zh: 超临界区容量外推常数
    name_en: supercritical extrapolation constant
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []

  - qid: Q:TEST:SUPERCRITICAL_RATIO
    name_zh: 超临界外推式比值项
    name_en: supercritical extrapolation ratio term
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []

  - qid: Q:TEST:GAMMA_FACTOR
    name_zh: 比热比 γ 因子
    name_en: gamma factor
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []

  - qid: Q:TEST:SUPERCRITICAL_TEMP_LIMIT
    name_zh: 超临界外推温度界限
    name_en: supercritical temperature bound
    domain: TEST
    dimension: TEMPERATURE
    canonical_unit: degC
    symbol_candidates: []

  - qid: Q:TEST:MARK_MARGIN
    name_zh: 动力操作式泄压阀标记余量
    name_en: marking margin for power-actuated PRV
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: "%"
    symbol_candidates: []

  - qid: Q:TEST:CORRECTION_FACTOR_COEFF
    name_zh: 压力修正因子系数项
    name_en: pressure correction factor coefficient
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []
    notes: US 版 0.1906 / 0.2292；SI 版 27.6 / 33.2

  - qid: Q:TEST:CORRECTION_FACTOR_CONST
    name_zh: 压力修正因子常数项
    name_en: pressure correction factor constant
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []
    notes: US 版 1,000 / 1,061；SI 版 1 000 / 1 061

  - qid: Q:TEST:SET_PRESSURE_COEF
    name_zh: 试验压力定义中的 set pressure 系数
    name_en: set pressure coefficient in P definition
    domain: TEST
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: []

  - qid: Q:TEST:ATMOSPHERIC_PRESSURE
    name_zh: 大气压项
    name_en: atmospheric pressure term
    domain: TEST
    dimension: PRESSURE
    canonical_unit: MPa
    symbol_candidates: []

  - qid: Q:TEST:SET_PRESSURE_OFFSET
    name_zh: 试验压力定义中的附加项
    name_en: offset term in P definition
    domain: TEST
    dimension: PRESSURE
    canonical_unit: MPa
    symbol_candidates: []
    notes: >-
      PG-69.2.3 的 P 定义用 2 psi (0.014 MPa)；PG-69.2.2 的 rated slope
      用 0.015 MPa。**ASME 原文自身不一致**，两个数都照录，不修正。

  - qid: Q:TEST:REPLACEMENT_VALVE_COUNT
    name_zh: 排放系数超差时替换试验的阀门数量上限
    name_en: replacement valve count limit
    domain: TEST
    dimension: COUNT
    canonical_unit: count
    symbol_candidates: []

  # ===================== MATE 域 =====================
  - qid: Q:MAT:CARBON_EQUIVALENT
    name_zh: 碳当量 CE
    name_en: carbon equivalent
    domain: MATE
    dimension: DIMENSIONLESS
    canonical_unit: dimensionless
    symbol_candidates: ["CE"]

  - qid: Q:MAT:CE_TAIL_SUBSTITUTE
    name_zh: CE 式中后两项的合并替代值
    name_en: carbon equivalent tail substitute
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: []
    notes: >-
      缺 Cr/Mo/V/Ni/Cu 分析值时，(Cr+Mo+V)/5 + (Ni+Cu)/15 合并为一个数。
      BPVC-I 取 0.15%，B31.1 取 0.1% —— **易混对**。

  - qid: Q:MAT:WELD_THICKNESS
    name_zh: 焊缝公称厚度
    name_en: nominal weld thickness
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []

  - qid: Q:MAT:PREHEAT_TEMP
    name_zh: 预热温度
    name_en: preheat temperature
    domain: MATE
    dimension: TEMPERATURE
    canonical_unit: degC
    symbol_candidates: []

  - qid: Q:MAT:HOLD_TEMP
    name_zh: 保温温度
    name_en: holding temperature
    domain: MATE
    dimension: TEMPERATURE
    canonical_unit: degC
    symbol_candidates: []

  - qid: Q:MAT:HOLD_TIME_RATE
    name_zh: 保温时间速率
    name_en: holding time rate
    domain: MATE
    dimension: DIMENSIONLESS
    canonical_unit: "hr per 25 mm"
    symbol_candidates: []
    notes: BPVC-I 写「1 hr/in. (1 hr/25 mm)」；B31.1 写「1 hr/in. (25 mm)」

  - qid: Q:MAT:HOLD_TIME_MIN
    name_zh: 保温时间最小值
    name_en: minimum holding time
    domain: MATE
    dimension: TIME
    canonical_unit: min
    symbol_candidates: []

  - qid: Q:MAT:HOLD_TIME_INCREMENT
    name_zh: 保温时间增量
    name_en: holding time increment
    domain: MATE
    dimension: DIMENSIONLESS
    canonical_unit: "min per 25 mm"
    symbol_candidates: []

  - qid: Q:MAT:MAX_CARBON_CONTENT
    name_zh: 最大实际碳含量
    name_en: maximum actual carbon content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: []

  - qid: Q:MAT:HEAD_SIZE_MAX
    name_zh: 封头最大口径
    name_en: maximum head size
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []
    notes: 原文给 NPS 8 (DN 200) —— 口径是**双重标识**，本体以 mm 为主单位，另记 NPS

  - qid: Q:MAT:PIPE_OD_MAX
    name_zh: 管子外径上限
    name_en: maximum pipe outside diameter
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []

  - qid: Q:MAT:NOZZLE_THROAT_MAX
    name_zh: 喉部/焊缝厚度上限
    name_en: maximum throat or weld thickness
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []

  - qid: Q:MAT:THICKNESS_LIMIT_HALF_IN
    name_zh: 1/2 in. 厚度上限
    name_en: half-inch thickness limit
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []
    notes: PW-39 各项豁免中反复出现的 1/2 in. (13 mm)

  - qid: Q:MAT:MIN_WALL_THICKNESS
    name_zh: 最小壁厚
    name_en: minimum wall thickness
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []

  - qid: Q:MAT:WELD_THICKNESS_BREAKPOINT
    name_zh: 焊缝厚度分界值
    name_en: weld thickness breakpoint
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []

  - qid: Q:MAT:BASE_METAL_THICKNESS_BREAKPOINT
    name_zh: 母材厚度分界值
    name_en: base metal thickness breakpoint
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []

  - qid: Q:MAT:DEPOSITION_THICKNESS_MAX
    name_zh: 单道焊缝熔敷厚上限
    name_en: maximum single-pass deposition thickness
    domain: MATE
    dimension: LENGTH
    canonical_unit: mm
    symbol_candidates: []

  # ===================== 化学成分（供公式变量绑定） =====================
  - qid: Q:MAT:CHEM_CARBON
    name_zh: 碳含量
    name_en: carbon content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: ["C"]

  - qid: Q:MAT:CHEM_MANGANESE
    name_zh: 锰含量
    name_en: manganese content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: ["Mn"]

  - qid: Q:MAT:CHEM_SILICON
    name_zh: 硅含量
    name_en: silicon content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: ["Si"]

  - qid: Q:MAT:CHEM_CHROMIUM
    name_zh: 铬含量
    name_en: chromium content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: ["Cr"]

  - qid: Q:MAT:CHEM_MOLYBDENUM
    name_zh: 钼含量
    name_en: molybdenum content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: ["Mo"]

  - qid: Q:MAT:CHEM_VANADIUM
    name_zh: 钒含量
    name_en: vanadium content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: ["V"]

  - qid: Q:MAT:CHEM_NICKEL
    name_zh: 镍含量
    name_en: nickel content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: ["Ni"]

  - qid: Q:MAT:CHEM_COPPER
    name_zh: 铜含量
    name_en: copper content
    domain: MATE
    dimension: MASS_FRACTION
    canonical_unit: "mass-%"
    symbol_candidates: ["Cu"]

  # ===================== 公式侧物理量 =====================
  # 这一段的价值在于**消歧**：同一个局部符号在不同公式里绑到不同 qid。
  # 典型：'P' 在 F-TEST-001 是入口压力、在 F-STR-004 是许用工作压力；
  #       'A' 在 F-TEST-001 是喉部面积、在 F-STR-003 是开孔削弱面积。
  # 局部符号仍可重名，绑定之后机器即可区分。
  - {qid: "Q:TEST:THEORETICAL_FLOW", name_zh: "理论流量", name_en: "theoretical flow", domain: "TEST", dimension: "MASS_FLOW", canonical_unit: "kg/hr", symbol_candidates: ["W_T", "Q_theoretical"]}
  - {qid: "Q:TEST:ACTUAL_FLOW", name_zh: "实际流量", name_en: "actual flow", domain: "TEST", dimension: "MASS_FLOW", canonical_unit: "kg/hr", symbol_candidates: ["Q_actual"]}
  - {qid: "Q:TEST:NOZZLE_THROAT_AREA", name_zh: "喷嘴喉部面积", name_en: "nozzle throat area", domain: "TEST", dimension: "AREA", canonical_unit: "mm^2", symbol_candidates: ["A"]}
  - {qid: "Q:TEST:SEAT_DIAMETER", name_zh: "阀座直径", name_en: "seat diameter", domain: "TEST", dimension: "LENGTH", canonical_unit: "mm", symbol_candidates: ["D"]}
  - {qid: "Q:TEST:LIFT", name_zh: "压力下的阀瓣升程", name_en: "lift at pressure", domain: "TEST", dimension: "LENGTH", canonical_unit: "mm", symbol_candidates: ["L"]}
  - {qid: "Q:TEST:INLET_PRESSURE", name_zh: "计算用入口绝对压力", name_en: "inlet absolute pressure for calculation", domain: "TEST", dimension: "PRESSURE", canonical_unit: "MPa", symbol_candidates: ["P"]}
  - {qid: "Q:TEST:DISCHARGE_PRESSURE", name_zh: "排放压力", name_en: "discharge pressure", domain: "TEST", dimension: "PRESSURE", canonical_unit: "MPa", symbol_candidates: ["P_d"]}
  - {qid: "Q:TEST:WATER_SPECIFIC_WEIGHT", name_zh: "入口工况水的重度", name_en: "specific weight of water", domain: "TEST", dimension: "DENSITY", canonical_unit: "kg/m^3", symbol_candidates: ["w"]}
  - {qid: "Q:TEST:MEAN_DISCHARGE_COEFF", name_zh: "多阀试验排放系数平均值", name_en: "mean discharge coefficient", domain: "TEST", dimension: "DIMENSIONLESS", canonical_unit: "dimensionless", symbol_candidates: ["avg_K_D"]}
  - {qid: "Q:TEST:CORRECTED_CAPACITY", name_zh: "修正后泄放能力", name_en: "corrected capacity", domain: "TEST", dimension: "MASS_FLOW", canonical_unit: "kg/hr", symbol_candidates: ["W"]}
  - {qid: "Q:TEST:BASE_CAPACITY", name_zh: "未修正泄放能力", name_en: "uncorrected capacity", domain: "TEST", dimension: "MASS_FLOW", canonical_unit: "kg/hr", symbol_candidates: ["W_base"]}
  - {qid: "Q:TEST:CORRECTION_FACTOR", name_zh: "超临界修正因子", name_en: "supercritical correction factor", domain: "TEST", dimension: "DIMENSIONLESS", canonical_unit: "dimensionless", symbol_candidates: ["CF"]}
  - {qid: "Q:TEST:CAPACITY_PRESSURE_SLOPE", name_zh: "容量对绝对压力的变化率", name_en: "rate of change of capacity with pressure", domain: "TEST", dimension: "MASS_FLOW", canonical_unit: "kg/hr per MPa", symbol_candidates: ["dW_dP"]}
  - {qid: "Q:TEST:INLET_SPECIFIC_VOLUME", name_zh: "入口特定比体积", name_en: "inlet specific volume", domain: "TEST", dimension: "SPECIFIC_VOLUME", canonical_unit: "m^3/kg", symbol_candidates: ["v", "nu"]}
  - {qid: "Q:TEST:SET_PRESSURE", name_zh: "设定压力", name_en: "set pressure", domain: "TEST", dimension: "PRESSURE", canonical_unit: "MPa", symbol_candidates: ["set_pressure"]}

  - {qid: "Q:STRUCT:MIN_WALL_THICKNESS", name_zh: "壳板最小厚度", name_en: "minimum shell plate thickness", domain: "STRUCT", dimension: "LENGTH", canonical_unit: "mm", symbol_candidates: ["t"]}
  - {qid: "Q:STRUCT:NET_WALL_THICKNESS", name_zh: "净壁厚", name_en: "net wall thickness", domain: "STRUCT", dimension: "LENGTH", canonical_unit: "mm", symbol_candidates: ["t_net"]}
  - {qid: "Q:STRUCT:GEOM_FACTOR_Z1", name_zh: "厚壁几何系数 Z1", name_en: "thick cylinder geometry factor Z1", domain: "STRUCT", dimension: "DIMENSIONLESS", canonical_unit: "dimensionless", symbol_candidates: ["Z_1"]}
  - {qid: "Q:STRUCT:GEOM_FACTOR_Z2", name_zh: "厚壁几何系数 Z2", name_en: "thick cylinder geometry factor Z2", domain: "STRUCT", dimension: "DIMENSIONLESS", canonical_unit: "dimensionless", symbol_candidates: ["Z_2"]}
  - {qid: "Q:STRUCT:INNER_RADIUS", name_zh: "最弱圈节内半径", name_en: "inner radius", domain: "STRUCT", dimension: "LENGTH", canonical_unit: "mm", symbol_candidates: ["R", "a"]}
