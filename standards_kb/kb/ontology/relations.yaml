# =============================================================================
# standards_kb / 本体等价集（EquivalenceSet）
# -----------------------------------------------------------------------------
# 两种 kind：
#   UNIT_CONVERSION —— 同一物理量的两种单位制表述。必须成对（INV-05）。
#                     expression_ratio = 两套表述的数值之比，用于校核等���；
#                     它**不是**工程单位换算因子，别混用。
#   CONFUSABLE     —— 同一物理量在不同标准下的判据，取值不同、极易混用。
#                     这不是"错误"，是"必须一起看"。
#
# 这份文件是本体最直接的业务产出：以前这 4 组易混对靠人脑记，
# 现在机器能列出并交叉校验。
# =============================================================================

meta:
  schema: standards_kb.ontology.relations/1.0
  version: "1.0.0+20261022"
  created: "2026-10-22"

sets:

  # ======================================================================
  # UNIT_CONVERSION —— US ↔ SI 配对
  # ======================================================================
  - sid: S:TEST:WATER_FLOW_CONSTANT
    kind: UNIT_CONVERSION
    quantity: Q:TEST:WATER_FLOW_CONSTANT
    members: [P-TEST-001, P-TEST-002]
    us_member: P-TEST-001
    si_member: P-TEST-002
    expression_ratio: 0.00211549605
    ratio_note: "5.092 / 2407 = 0.00211549605"
    ratio_amendment: >-
      【2026-10-22 修订】初版记 0.00211550（7 位有效数字手工舍入）。
      按 INV-10(b) 的 1e-6 相对容差复算，0.00211550 相对真实值
      5.092/2407 = 0.0021154960461 的偏差为 1.87e-6，**超出容差**，
      校验器会判违规。expression_ratio 是可复算的派生量，
      记成能精确复算的值比记成手工舍入值更符合 INV-10 的立意，故改为满精度。
      该改动不涉及任何标准正文取值。
    verification: >-
      同一物理工况代入两套公式应给出同一流量。取 D=2 in / 50.8 mm、
      L=0.25 in / 6.35 mm、P−P_d=985 psia / 6.792 MPa、w=62.4 lb/ft³ / 999.5 kg/m³：
      US 式得 937,300 lb/hr；SI 式得 425,000 kg/hr，折合 937,300 lb/hr。两者一致。
    risk: >-
      混用即差约 473 倍。SI 版的 5.092 是空格千分位「5 092」，不是 5092。
      5092 会让流量大 1000 倍（见 kb/_evidence/ASME-BPVC-I_p104_raster.png 纯位图核验）。

  - sid: S:TEST:STEAM_FLOW_CONSTANT
    kind: UNIT_CONVERSION
    quantity: Q:TEST:STEAM_FLOW_CONSTANT
    members: [P-TEST-003, P-TEST-004]
    us_member: P-TEST-003
    si_member: P-TEST-004
    expression_ratio: 0.1019417
    ratio_note: "5.25 / 51.5"
    verification: >-
      同理，两套公式在同一物理工况下应给出同一流量。蒸汽式 W_T = C × πDLP，
      压力项**线性无根号**，与水的式子形式不同，混用形式本身就会算错。
    risk: 蒸汽式无 √ 因子，套用水的式子会得到错误量级。

  - sid: S:TEST:FLOW_UNIT_FACTOR
    kind: UNIT_CONVERSION
    quantity: Q:TEST:FLOW_UNIT_FACTOR
    members: [P-TEST-010, P-TEST-011]
    us_member: P-TEST-010
    si_member: P-TEST-011
    expression_ratio: 8.333333
    ratio_note: "(1/60) / (1/500)"
    verification: >-
      两者都是**流量单位**换算而非量纲换算：lb/hr → gal/min 与 kg/hr → L/min。
      数值不同是正常的，因为被换算的目标单位不同。
    risk: >-
      这条是工程里真正会用的换算：把 ASME 的 lb/hr 结果转成 gal/min 报工，
      或把 kg/hr 转成 L/min。切勿把 1/500 当成 1/60 用。

  - sid: S:TEST:SUPERCRITICAL_RATIO
    kind: UNIT_CONVERSION
    quantity: Q:TEST:SUPERCRITICAL_RATIO
    members: [P-TEST-016, P-TEST-017]
    us_member: P-TEST-016
    si_member: P-TEST-017
    expression_ratio: 10.3444444
    ratio_note: "(0.95/5.25) / (0.90/51.45) = 48.8775 / 4.725 = 10.3444444"
    verification: >-
      外推式 W = 1,135.8 × 比值项 × (dW/dP) × √(P/ν)。1,135.8 在两版里相同，
      差异全部体现在比值项上。
    risk: 分子分母的单位制必须与 dW/dP、P、ν 保持一致，不能交叉混用。

  # ======================================================================
  # CONFUSABLE —— 跨标准同判据不同取值（必须一起看）
  # ======================================================================
  - sid: S:MAT:CE_THRESHOLD
    kind: CONFUSABLE
    quantity: Q:MAT:CARBON_EQUIVALENT
    members: [P-MAT-001, P-MAT-011]
    cross_standard: true
    standards: ["ASME BPVC Section I-2010", "ASME B31.1-2007"]
    values:
      - {entry_id: P-MAT-001, relation: "<=", value: 0.45, unit: dimensionless, clause: "TABLE PW-39 GENERAL NOTES (a)(2)(a)"}
      - {entry_id: P-MAT-011, relation: "<", value: 0.50, unit: dimensionless, clause: "Table 132 GENERAL NOTES (b)(1)"}
    difference: "阈值不同（0.45 vs 0.50）**且判据方向不同**（≤ vs <）"
    risk: >-
      两个都是"碳当量判据"，但不是同一个判据。套错标准即误判 PWHT 豁免。
    verdict: 不可互换

  - sid: S:MAT:CE_TAIL_SUBSTITUTE
    kind: CONFUSABLE
    quantity: Q:MAT:CE_TAIL_SUBSTITUTE
    members: [P-MAT-002, P-MAT-012]
    cross_standard: true
    standards: ["ASME BPVC Section I-2010", "ASME B31.1-2007"]
    values:
      - {entry_id: P-MAT-002, relation: "=", value: 0.15, unit: "mass-%", clause: "TABLE PW-39 GENERAL NOTES (a)(2)(a), Note"}
      - {entry_id: P-MAT-012, relation: "=", value: 0.1, unit: "mass-%", clause: "Table 132 GENERAL NOTES (b)(1), Note"}
    difference: "替代值不同（0.15% vs 0.1%）"
    risk: 缺化学分析值时的兜底数，套错会让 CE 偏大或偏小
    verdict: 不可互换

  - sid: S:MAT:PREHEAT_TEMP
    kind: CONFUSABLE
    quantity: Q:MAT:PREHEAT_TEMP
    members: [P-MAT-004, P-MAT-014]
    cross_standard: true
    standards: ["ASME BPVC Section I-2010", "ASME B31.1-2007"]
    values:
      - {entry_id: P-MAT-004, relation: ">=", value: 250, unit: "degF (degC)", clause: "TABLE PW-39 GENERAL NOTES (a)(2)(b)", si_value: 120}
      - {entry_id: P-MAT-014, relation: ">=", value: 250, unit: "degF (degC)", clause: "Table 132 GENERAL NOTES (b)(2)", si_value: 121}
    difference: "英制值相同（250 °F），**公制值不同**（120 °C vs 121 °C）"
    risk: >-
      250 °F 精确等于 120 °C，所以 121 °C 不是换算误差，是两标准原文取值不同。
      只看英制数会以为两者相同。
    verdict: 不可互换

  - sid: S:MAT:HOLD_TEMP
    kind: CONFUSABLE
    quantity: Q:MAT:HOLD_TEMP
    members: [P-MAT-007, P-MAT-017]
    cross_standard: true
    standards: ["ASME BPVC Section I-2010", "ASME B31.1-2007"]
    values:
      - {entry_id: P-MAT-007, relation: ">=", value: 1100, unit: "degF (degC)", clause: "TABLE PW-39 table body, P-No. 1 Group No. 1,2,3", si_value: 595}
      - {entry_id: P-MAT-017, relation: ">=", value: 1100, unit: "degF (degC)", clause: "Table 132 table body, P-No. 1 Gr. Nos. 1, 2", si_value: 600}
    difference: "英制值相同（1,100 °F），公制值不同（595 °C vs 600 °C）"
    risk: 同 S:MAT:PREHEAT_TEMP —— 1,100 °F = 593 °C，两标准都没取这个值
    verdict: 不可互换

  - sid: S:MAT:HOLD_TIME_RATE
    kind: CONFUSABLE
    quantity: Q:MAT:HOLD_TIME_RATE
    members: [P-MAT-008, P-MAT-018]
    cross_standard: true
    standards: ["ASME BPVC Section I-2010", "ASME B31.1-2007"]
    values:
      - {entry_id: P-MAT-008, relation: "=", value: "1 hr/in. (1 hr/25 mm)", unit: "hr per in (hr per 25 mm)", clause: "TABLE PW-39 table body"}
      - {entry_id: P-MAT-018, relation: "=", value: "1 hr/in. (25 mm)", unit: "hr per in (hr per 25 mm)", clause: "Table 132 table body"}
    difference: "**量相同，排印不同** —— BPVC-I 把公制括注写成「1 hr/25 mm」，B31.1 写成「(25 mm)」"
    risk: >-
      本组是**唯一可判定为等价**的易混对，但措辞差异容易让人怀疑是两个数。
      判定依据：两者的量纲都是 hr per 25 mm，且 1 hr/in. = 1 hr/25 mm。
    verdict: 等价（量相同，仅排印不同）

  - sid: S:MAT:WELD_THICKNESS_WINDOW
    kind: CONFUSABLE
    quantity: Q:MAT:WELD_THICKNESS
    members: [P-MAT-003, P-MAT-027, P-MAT-013]
    cross_standard: true
    standards: ["ASME BPVC Section I-2010", "ASME B31.1-2007"]
    values:
      - {entry_id: P-MAT-003, relation: "range", value: "19..38", unit: "in (mm)", clause: "TABLE PW-39 GENERAL NOTES (a)(2)"}
      - {entry_id: P-MAT-027, relation: "<=", value: 38, unit: "in (mm)", clause: "TABLE PW-39 GENERAL NOTES (2)"}
      - {entry_id: P-MAT-013, relation: "range", value: "19.0..38", unit: "in (mm)", clause: "Table 132 GENERAL NOTES (b)"}
    difference: >-
      区间数值相同；B31.1 文本层保留一位小数 19.0。
      三条不是并列的三个判据，而是**两个标准里同一事实的两种粒度**：
      P-MAT-003 与 P-MAT-013 是"窗口"（区间形式 19..38），
      P-MAT-027 是同一 BPVC 条款里单列出来的"上限"（<= 1 1/2 in. (38 mm)）。
      引用时按需取区间或上限，但两者同源于 PW-39 (a)(2)。
    amend_note: >-
      【2026-10-22 补登】首轮校验报 INV-06：Q:MAT:WELD_THICKNESS 在两个标准下都有判据，
      但 P-MAT-027（BPVC 侧单列的焊缝厚度上限）此前未登记。已补入本集合。
    risk: 差异极小，但 B31.1 无 PDF，只能标 PENDING_VERIFICATION，无法做位图级复核
    verdict: 疑似等价（待 B31.1 正文可得后定案）

  - sid: S:MAT:DEPOSITION_THICKNESS_MAX
    kind: CONFUSABLE
    quantity: Q:MAT:DEPOSITION_THICKNESS_MAX
    members: [P-MAT-005, P-MAT-015]
    cross_standard: true
    standards: ["ASME BPVC Section I-2010", "ASME B31.1-2007"]
    values:
      - {entry_id: P-MAT-005, relation: "<=", value: 6, unit: "in (mm)", clause: "TABLE PW-39 GENERAL NOTES (a)(2)(c)"}
      - {entry_id: P-MAT-015, relation: "<=", value: 6, unit: "in (mm)", clause: "Table 132 GENERAL NOTES (b)(3)"}
    difference: "数值相同（1/4 in. = 6 mm）"
    risk: 数值相同，条款编号体系不同，引用时别串
    verdict: 等价（数值相同）

  - sid: S:MAT:PREHEAT_TEMP_200F
    kind: CONFUSABLE
    quantity: Q:MAT:PREHEAT_TEMP
    members: [P-MAT-006, P-MAT-016]
    cross_standard: true
    standards: ["ASME BPVC Section I-2010", "ASME B31.1-2007"]
    values:
      - {entry_id: P-MAT-006, relation: ">=", value: 200, unit: "degF (degC)", clause: "TABLE PW-39 GENERAL NOTES (a)(1)", si_value: 95}
      - {entry_id: P-MAT-016, relation: ">=", value: 200, unit: "degF (degC)", clause: "Table 132 GENERAL NOTES (a)(2)", si_value: 95}
    difference: "数值完全相同（200 °F / 95 °C），但**判据分支不同**"
    risk: >-
      BPVC-I 的 (a)(1) 与 B31.1 的 (a) 路径语义平行但不是同一条款，
      引用时必须带标准号，不能只写「通用注 (a)」。
    verdict: 等价（数值相同），但条款路径不同，引用须带标准

  - sid: S:TEST:SET_PRESSURE_OFFSET_INCONSISTENCY
    kind: CONFUSABLE
    quantity: Q:TEST:SET_PRESSURE_OFFSET
    members: [P-TEST-029]
    cross_standard: false
    standards: ["ASME BPVC Section I-2010"]
    values:
      - {entry_id: P-TEST-029, relation: "=", value: "2 psi (0.014 MPa)", unit: "psi (MPa)", clause: "PG-69.2.3 where（P 的定义）"}
    difference: >-
      **标准自身不一致**：PG-69.2.3 的 P 定义用 +0.014 MPa，
      PG-69.2.2 的 rated slope 定义用 +0.015 MPa。两个数都照录，不修正。
    risk: 做 rated slope 计算时若误用 0.014 会与标准公式不自洽
    verdict: 标准原文不一致，已照录并标注

  # ======================================================================
  # COLUMN_CORRESPONDENCE —— 跨标准数据表列对应
  # ======================================================================
  - sid: S:GEOM:FLANGE_GEOMETRY_CROSS_STANDARD
    kind: COLUMN_CORRESPONDENCE
    cross_standard: true
    standards: ["GB/T 15530.1-2008", "\u0413\u041e\u0421\u0422 1536-76"]
    shared_quantities:
      - Q:GEOM:NOMINAL_SIZE
      - Q:GEOM:FLANGE_OUTER_DIA
      - Q:GEOM:BOLT_COUNT
      - Q:GEOM:BOLT_THREAD
    near_miss:
      - {gb_column: "d", gb_quantity: Q:GEOM:SEAL_FACE_DIA,
         gost_column: "D1", gost_quantity: Q:GEOM:SEALING_FACE_OUTER_DIA,
         verdict: "近似同量，故意未合并"}
      - {gb_column: "f", gb_quantity: Q:GEOM:SEAL_FACE_HEIGHT,
         gost_column: "f", gost_quantity: Q:GEOM:SEAL_STEP_HEIGHT,
         verdict: "同符号不同含义，故意未合并"}
    difference: >-
      两套标准的法兰尺寸表有 4 个物理量完全同义（Dn / D / 螺栓数 / 螺栓螺纹），
      可直接跨标准取值；但密封面与台阶类尺寸**不可直接互换**：
      GB 表 3~6 只给突面型（d 密封面直径、f 凸起高度），
      ГОСТ 表 1~5 给对接面/凸面型（D1/D2、q 槽深），
      ГОСТ 表 6~7 又是台阶/凹面型（D3/D4/D5/D6、f 台阶高度）。
      两套表里都出现符号 f，但含义不同 —— 这是标准层面的符号碰撞，
      与公式层的 P / A / D / W 同类，必须登记而不是靠人脑记。
    risk: >-
      按列名跨标准套用尺寸会取到不同的物理量：
      GB 的 f=2 是凸起高度，ГОСТ 表 6 的 f=3 是密封台阶高度；
      GB 的 d=35 是密封面直径，ГОСТ 的 D1=65 是密封面外径。
    verdict: 4 个物理量可跨标准共用，密封面/台阶类不可互换
