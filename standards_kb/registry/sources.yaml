# =============================================================================
# standards_kb / 标准源登记表
# -----------------------------------------------------------------------------
# 记录「去哪里取标准正文」以及「实测能不能取到」。
# 每条 access_probe 都是本机真实请求的结果，不是推测。
# 探测时间: 2026-10-22 ~ 2026-10-24
#
# 字段说明:
#   family        : GB / ASME / GOST / ISO 四族
#   kind          : DIMENSION(尺寸/接口表型) | MECHANICS(力学公式型) |
#                   TEST(试验方法型) | MATERIAL(材料性能型) | CODE(体系/通用)
#   standard_id   : 该标准在本库中的稳定标识（正文资产按它归集）
#   body_status   : FULL_TEXT_MIRROR  = 本机已实测拿到正文
#                   OFFICIAL_LIST     = 只能拿到官方目录/范围页(证明名称与状态,不证明条款)
#                   PAYWALL          = 正文付费,本机不可得
#                   RENDERED_JS      = 正文需 JS 渲染,静态抓取拿不到
#                   LOCAL_FILE       = 项目内已有本地正文
#   extraction    : PDF_TEXT | OCR_TEXT | HTML_TABLE | IMAGE_OCR | MANUAL
#   notes         : 抽取时的坑
#
# 重要约定
# -----------------------------------------------------------------------------
# `body_status` 描述**这个源**能不能拿到正文；
# 某一具体标准**有没有**免费正文，另由 kb/catalog/gb_body_availability.json
# 逐条记录（GB 族尤其重要：在目录里 ≠ 正文免费开放）。
# =============================================================================

meta:
  schema: standards_kb.sources/1.1
  probed_at: "2026-10-24"
  probe_env: "Windows 11 / PowerShell 5.1 / Python 3.14.7 / pymupdf / Pillow"
  disclaimer: >-
    登记表只证明「正文来源是否存在、能否被本机取到」。
    取得正文不等于取得条款级结论;每条公式条目仍须单独标记证据等级。

families:
  # ===========================================================================
  GB:
    label: "国家标准（GB/T）"
    note: >-
      中国国标。全文公开系统 openstd.samr.gov.cn 对**部分**标准免费开放在线正文，
      但正文是**栅格图片**（无文字层），需 OCR 才有文本。
    sources:
      - id: GB-PUB
        title: "国家标准全文公开系统 —— 目录层"
        kind: CODE
        body_status: FULL_TEXT_MIRROR
        url: "https://openstd.samr.gov.cn/bzgk/std/std_list"
        local: "kb/catalog/gb_openstd.json"
        extraction: HTML_TABLE
        access_probe: "HTTP 200，服务端直出结果行，无需浏览器执行 JS"
        notes: >-
          旧路径 /bzgk/gb/std_list 已失效；新路径 /bzgk/std/std_list 可用。
          结果行在 <table class="table result_list"> 的第二个 <tbody>，
          每行 10 个 <td>，标准号与标题的 onclick 里带 showInfo('HCNO')。
          目录产出 1197 条（50 次检索 / 34 个检索词），落盘为可复用资产。
        verified_this_session: true

      - id: GB-PUB-BODY
        title: "国家标准全文公开系统 —— 正文层（栅格页图）"
        kind: CODE
        body_status: FULL_TEXT_MIRROR
        url: "https://openstd.samr.gov.cn/bzgk/std/showGb?type=online&hcno=<HCNO>"
        local: "runs/GB-<standard_id>/"
        extraction: IMAGE_OCR
        access_probe: "HTTP 200，735 KB，含 var page = N 与 N 个 div.page"
        notes: >-
          三步链路，**顺序不可颠倒**：
            1) /bzgk/std/newGbInfo?hcno=<HCNO>  建立会话（否则 showGb 被重定向回详情页）
            2) /bzgk/std/showGb?type=online&hcno=<HCNO>  取正文页 HTML
            3) /bzgk/std/viewGbImg?fileName=<bg 原样>  取精灵图
          第 3 步**必须带请求头 Cache-Alive: chunked**，否则返回 200 但 0 字节。
          正文**无 HTML 文字层**，是 2320x3280 精灵图（10列x10行，瓦片 232x328），
          一张精灵图承载连续 4~5 页；同组各页瓦片互不重叠。
          重组算法见 tools/fetch_gb.py。
        verified_this_session: true

      - id: GB-GB_T_15530.1-2008
        title: "GB/T 15530.1-2008 — 铜合金整体铸造法兰"
        kind: DIMENSION
        standard_id: "GB/T 15530.1-2008"
        body_status: FULL_TEXT_MIRROR
        source_ref: GB-PUB-BODY
        hcno: FA956785E4D87F6DCC91629CA9238510
        local: "runs/GB-GB_T_15530.1-2008/"
        extraction: IMAGE_OCR
        notes: >-
          本库**第一本真正取到正文的 GB/T 标准**：15 页、4 张精灵图（2320x3280，10x10 瓦片）。
          页图已用机器重组落盘，内容靠人工逐格视觉转录。
          已固化表 1~表 6 共 6 条数据表条目（kb/data/GB_T_15530.1-2008.json）；
          表 7（PN40 榫槽面）跨页，整体记 pending，不落半张。
          id 沿用 fetch_gb.py 的输出目录名规则（GB- + 标准号净化），故与 runs/ 目录同名。
        verified_this_session: true

      - id: GB-PUB-AVAIL
        title: "国家标准全文公开系统 —— 正文可得性台账"
        kind: CODE
        body_status: OFFICIAL_LIST
        local: "kb/catalog/gb_body_availability.json"
        extraction: MANUAL
        notes: >-
          逐条记录「该标准有没有免费在线正文」：OPEN_BODY / NO_BODY / ERROR。
          **在目录里 ≠ 正文免费开放** —— 实测 1003 条阀门相关标准中仅 63 条有免费正文
          （63 开放 / 940 无 / 0 错误）。这是选标准时必须先查的表。
        verified_this_session: true

      - id: GB-DOWNLOAD
        title: "国家标准全文公开系统 —— 下载口"
        kind: CODE
        body_status: PAYWALL
        url: "https://openstd.samr.gov.cn/bzgk/std/download?hcno=<HCNO>"
        extraction: MANUAL
        notes: >-
          需 verifyCode 图形验证码。**本库主动放弃此路径**（不绕过反爬机制），
          只用免费公开的在线预览路径。

