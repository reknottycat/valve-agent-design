# =============================================================================
# 结论（供后续设计引用）
# =============================================================================
findings:
  - "三族都存在可获取正文的路,但路径不同: GOST→meganorm(直连 PDF); ASME→law.resource/archive.org(IBR 镜像); GB→全文公开系统(栅格图+OCR)。"
  - "archive.org 的 gov.law.asme.* 集合是 ASME 公式的最大免费来源(47 项,含 B31 系列与 BPVC)。"
  - "ASME 标准内部还要再分层: B16.9 这类是 DIMENSION(给接口尺寸), B31.9/BPVC 是 MECHANICS(给公式)。"
  - "OCR 文本层把希腊字母 ASCII 化(S=σ、SE=σ_e),且双栏交错,抽取器必须做符号归一与版面重建。"
  - "OCR 文本层还会**丢小数点**（实测 SI 水试验常数 5.092 被读成 5092，差 1000 倍）。任何 SI 常数必须做单位换算闭合验证 + 物理量级交叉验证。"
  - "官方目录页 ≠ 条款正文。项目既有纪律(UNVERIFIED_CLAUSE)必须延伸到本登记表。"
  - "GB 族特有: 在目录里 ≠ 正文免费开放。实测 1003 条阀门相关标准中仅 63 条有免费正文（63 开放 / 940 无 / 0 错误）。选标准前先查 kb/catalog/gb_body_availability.json。"
  - "body_status 有两级语义: registry 的 body_status 描述**这个源**能不能拿到正文；条目级 body_status 描述**该条内容的获取形态**。GB/T 15530.1-2008 在 registry 记 FULL_TEXT_MIRROR（页图在手），在数据条目记 RENDERED_JS（在线阅读器 JS 渲染、无文字层，只能视觉读表）。"
  - "GB 正文三步链路的两个硬约束: newGbInfo 必须先做；viewGbImg 必须带 Cache-Alive: chunked 头否则 0 字节。"
