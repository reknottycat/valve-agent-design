assumptions:
  - id: A1
    text: "阀体名义壁厚 12 mm,腐蚀裕量 1.5 mm"
    basis: "工程量级假设"
    impact: "仅影响承压量级校核;实际由抗冲击与低温韧性控制"
  - id: A2
    text: "摆盘厚度 14 mm;铰轴到盘心臂长 95 mm"
    basis: "工程量级假设"
    impact: "影响关闭力矩与杠杆比,进而影响手轮操作力"
  - id: A3
    text: "手轮端有效力臂 150 mm;螺纹摩擦 mu=0.15"
    basis: "青铜对青铜常见量级"
    impact: "启闭力矩 ∓33%,是本轮不确定性最大项"
  - id: A4
    text: "座倾角 phi=45°,密封线宽 4 mm"
    basis: "参数化研究中点"
    impact: "接触压强 7.6-14.7 MPa 区间;随 phi 变化约 2 倍"
  - id: A5
    text: "法兰螺栓按 ф15 孔推定 M14"
    basis: "孔径推定"
    impact: "螺栓应力 10.5 MPa;实际规格须回 ГОСТ 1536-76"

